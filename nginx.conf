server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache hashed asset files aggressively; the HTML shell never.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path returns index.html so React Router handles it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
